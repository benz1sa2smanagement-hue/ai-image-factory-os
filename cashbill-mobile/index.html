<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cashbill Pro Mobile Pilot</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#1a2940;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#142440;color:#fff;padding:18px 4vw;display:flex;gap:16px;align-items:center;justify-content:space-between}header b{font-size:19px}header span{font-size:12px;color:#bed0ff}.layout{display:flex;min-height:calc(100vh - 65px)}nav{background:white;width:220px;padding:18px;border-right:1px solid #e1e7f0}nav button{display:block;width:100%;padding:13px;margin:3px 0;text-align:left;background:transparent;border:0;border-radius:10px;color:#33445a;font-size:14px}nav button.active{background:#eaf0ff;color:#174bd3;font-weight:700}main{padding:24px;flex:1;min-width:0;max-width:1300px;margin:0 auto}h1{font-size:25px;margin:0 0 5px}.sub{color:#738198;margin:0 0 20px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.panel,.stat{background:white;border:1px solid #e3e9f3;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #12243d05}.stat small{color:#78899e}.stat strong{display:block;font-size:28px;margin-top:8px}.columns{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}button.action{background:#2d62ef;color:white;border:0;padding:11px 15px;border-radius:9px;font-weight:700;cursor:pointer}button.alt{background:#e9effc;color:#234bc1}button.stop{background:#fce8eb;color:#b3223a}button:disabled{opacity:.45}input,textarea,select{padding:11px;border:1px solid #d4dfea;border-radius:9px;font:inherit;max-width:100%;width:100%;margin:8px 0}input[type=file]{background:#f8faff}textarea{height:90px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:570px}td,th{border-bottom:1px solid #e8edf5;text-align:left;padding:10px}th{color:#65758d;background:#f8faff}.scroll{overflow:auto}.muted{color:#78889b;font-size:12px}.tag{display:inline-block;background:#eaf1ff;color:#2655c9;border-radius:20px;padding:4px 9px;font-size:11px}.bar{height:10px;background:#e6ebf5;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#2d62ef;transition:width .3s}.events{max-height:330px;overflow:auto}.event{border-left:3px solid #d1ddfc;padding:8px 13px;margin:9px 0;font-size:13px}a{color:#3459cc}.hidden{display:none}.notice{background:#fff6e7;color:#885d16;border:1px solid #f3deae;border-radius:12px;padding:12px;margin:15px 0;font-size:12px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}.row input[type=checkbox]{width:auto} @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}nav{display:flex;width:100%;overflow:auto;padding:5px;position:sticky;top:0;z-index:2}nav button{width:auto;flex-shrink:0;white-space:nowrap;font-size:12px}.layout{display:block}main{padding:15px}h1{font-size:22px}header{padding:14px}} </style></head><body><header><b>▣ CASHBILL PRO <span>Mobile Pilot</span></b><span>LOCAL · NO LOGIN · NO FLOWACCOUNT WRITE</span></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB'}).format(+n||0);
let currentStep=0;let activeBill=null;
function billPreview(){const r=activeBill||rows[Math.max(0,Math.min(rows.length-1,cursor))];if(!r)return '<div class="muted">นำเข้าไฟล์เพื่อดูตัวอย่างบิล</div>';const step=currentStep;const line=(label,val,index)=>'<div style="display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:9px;margin:5px 0;background:'+(step===index?'#fff1bc':'#f8faff')+';border:1px solid '+(step===index?'#ecaf2f':'#ebeff5')+'"><span>'+esc(label)+(step===index?' <b style="color:#a66700">◉ กำลังตรวจ</b>':'')+'</span><b>'+esc(val)+'</b></div>';return '<section class="panel"><h3>▤ ตัวอย่างบิลสำหรับตรวจสอบ <span class="tag">PREVIEW — ไม่ใช่หน้าจอ FlowAccount จริง</span></h3><p class="muted">เลขออเดอร์ '+esc(r.id)+' · '+esc(r.company)+'</p>'+line('รายการสินค้า',String(r.itemCount||1)+' รายการ',0)+line('ยอดสินค้าผู้ซื้อ',money(r.productPaid),1)+line('ค่าขนส่งผู้ซื้อ',money(r.shipping),2)+line('ส่วนลดผู้ขาย',money(r.sellerVoucher),3)+line('ตรวจ VAT 7% (แสดงเพื่อการตรวจเท่านั้น)',money((r.total||0)*7/107),4)+line('ยอดชำระตามไฟล์',money(r.total),5)+'<p class="muted">'+esc(r.issue||'ผ่านการตรวจเบื้องต้น')+'</p></section>'}
const sections=[['dashboard','▦ ภาพรวม'],['upload','↥ อัปโหลด CSV'],['orders','▤ รายการบิล'],['rules','⚙ กฎบัญชี'],['chat','✦ สั่งงาน'],['live','◉ Live Monitor']];let current='dashboard',rows=[],rules=[{name:'ห้ามสร้างบิลซ้ำ',enabled:true},{name:'ตรวจยอดสุทธิเป็นบวก',enabled:true},{name:'แจ้งยอดค่าขนส่งติดลบ',enabled:true},{name:'เตือนข้อมูลภาษีไม่ครบ',enabled:true}],events=[],cursor=0,timer=null,paused=false;
try{const x=JSON.parse(localStorage.getItem('cashbill_mobile_pilot')||'{}');rows=x.rows||rows;rules=x.rules||rules;events=x.events||events}catch{}
const persist=()=>{try{localStorage.setItem('cashbill_mobile_pilot',JSON.stringify({rows,rules,events:events.slice(0,50)}))}catch{}};
const log=t=>{events.unshift({time:new Date().toLocaleTimeString('th-TH'),text:t});persist()},kpi=(l,v)=>'<div class="stat"><small>'+l+'</small><strong>'+v+'</strong></div>';
function nav(){ $('nav').innerHTML=sections.map(s=>'<button class="'+(current===s[0]?'active':'')+'" data-page="'+s[0]+'">'+s[1]+'</button>').join('') }
function tab(page){current=page;nav();render()}
const inspect=()=>{const seen=new Set();rows.forEach(r=>{let problems=[];const key=r.company+'|'+r.id;if(!r.id)problems.push('ไม่มีเลขออเดอร์');else if(seen.has(key)&&rules[0]?.enabled)problems.push('เลขออเดอร์ซ้ำ');seen.add(key);if(!(r.total>0)&&rules[1]?.enabled)problems.push('ยอดไม่ถูกต้อง');if(r.shipping<0&&rules[2]?.enabled)problems.push('ค่าขนส่งติดลบ');if(r.doc==='tax'&&(!r.taxId||!r.address)&&rules[3]?.enabled)problems.push('ข้อมูลภาษีไม่ครบ');r.issue=problems.join('; ');r.status=problems.length?'รอตรวจ':'ผ่านตรวจ'});persist()};
const table=()=>'<div class="scroll"><table><thead><tr><th>Order ID</th><th>บริษัท</th><th>ยอดสุทธิ</th><th>ค่าขนส่ง</th><th>เอกสาร</th><th>สถานะ</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(r.company)+'</td><td>'+money(r.total)+'</td><td>'+money(r.shipping)+'</td><td>'+esc(r.doc==='tax'?'ใบกำกับภาษี':'บิลเงินสด')+'</td><td><span class="tag">'+esc(r.status||'รอตรวจ')+'</span><div class="muted">'+esc(r.issue||'')+'</div></td></tr>').join('')+'</tbody></table></div>';
const feed=()=>'<div class="events">'+(events.length?events.slice(0,20).map(e=>'<div class="event"><small class="muted">'+esc(e.time)+'</small><div>'+esc(e.text)+'</div></div>').join(''):'<p class="muted">ยังไม่มีกิจกรรม</p>')+'</div>';
function render(){let h='<h1>'+sections.find(s=>s[0]===current)[1]+'</h1><p class="sub">ทดลองใช้งานจากมือถือได้ทันที • ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น</p>';
if(current==='dashboard'){h+='<div class="grid">'+kpi('รายการทั้งหมด',rows.length)+kpi('ผ่านตรวจ',rows.filter(x=>x.status==='ผ่านตรวจ').length)+kpi('รอตรวจ',rows.filter(x=>x.status==='รอตรวจ').length)+kpi('ตรวจในรอบนี้',cursor)+'</div><div class="columns"><section class="panel"><h3>รายการออเดอร์</h3>'+table()+'<div class="row"><button class="action" data-page="upload">นำเข้าไฟล์</button><button class="action alt" data-page="live">ตรวจแบบ Live</button></div></section><section class="panel"><h3>กิจกรรมล่าสุด</h3>'+feed()+'</section></div>'}
if(current==='upload'){h+='<section class="panel"><h3>นำเข้าข้อมูล CSV / Excel (.xlsx, .xls)</h3><input id="file" type="file" accept=".csv,.xlsx,.xls,text/csv"><div class="notice">ไฟล์ถูกอ่านในเบราว์เซอร์ของคุณ โดย Excel ต้องโหลดตัวอ่านจาก CDN ครั้งแรก ข้อมูลบัญชีไม่ถูกส่งไปยังเซิร์ฟเวอร์ของแอป ตัวนี้ยังไม่แก้ FlowAccount จริง</div><div class="row"><button class="action" id="import">อ่านไฟล์</button><button class="action alt" id="sample">โหลดตัวอย่าง</button></div><p class="muted">หัวตารางแนะนำ: Order ID, Company, Total, Shipping, Document Type, Tax ID, Address</p></section>'}
if(current==='orders'){h+='<section class="panel"><div class="row"><button class="action" id="export">ส่งออกผลตรวจ CSV</button><button class="action alt" id="clear">ล้างข้อมูล</button></div>'+table()+'</section>'}
if(current==='rules'){h+='<section class="panel"><h3>กฎตรวจเบื้องต้น</h3>'+rules.map((r,i)=>'<label class="row"><input type="checkbox" data-rule="'+i+'" '+(r.enabled?'checked':'')+'>'+esc(r.name)+'</label>').join('')+'<p class="muted">กฎข้อความที่เพิ่มเองเป็นบันทึก ยังไม่มีตัวประมวลผลอัตโนมัติ</p><input id="ruleName" placeholder="ชื่อกฎใหม่"><button class="action" id="addRule">บันทึกกฎ</button></section>'}
if(current==='chat'){h+='<section class="panel"><h3>Command Workspace (Rule-based)</h3><textarea id="command" placeholder="เช่น ตรวจออเดอร์ซ้ำ หรือ ตรวจยอดและ VAT"></textarea><button class="action" id="runCommand">วิเคราะห์คำสั่ง</button><div class="notice" id="answer">ระบบนี้ยังไม่ใช่ AI ออนไลน์ สามารถช่วยสรุปขั้นตอนตรวจและนำทางเมนูเท่านั้น</div></section>'}
if(current==='live'){const pct=rows.length?Math.round((cursor+currentStep/6)/rows.length*100):0;h+='<div class="columns"><section class="panel"><h3>Live Progress (ตรวจไฟล์ในเครื่อง)</h3><h2>'+cursor+' / '+rows.length+' <span class="tag">'+pct+'%</span></h2><div class="bar"><div style="width:'+pct+'%"></div></div><p class="muted">นี่คือการตรวจข้อมูลที่อัปโหลด ไม่ใช่การแก้ไข FlowAccount</p><div class="row"><button class="action" id="start">เริ่ม</button><button class="action alt" id="pause">พัก / ต่อ</button><button class="action stop" id="stop">หยุด</button></div></section><section class="panel"><h3>Live Activity</h3>'+feed()+'</section></div>'+billPreview()}
$('main').innerHTML=h;bind()}
function csvParse(s){s=s.replace(/^\uFEFF/,'');let out=[],row=[],field='',quote=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x.trim()))out.push(row);row=[]}else field+=c}row.push(field);if(row.some(x=>x.trim()))out.push(row);return out}
function importRows(text){
let a=csvParse(text);if(a.length<2)throw Error('ไม่พบข้อมูลในไฟล์');
const cols=a.shift().map(x=>String(x).trim().toLowerCase().replace(/[\\s_\\-]/g,''));
let idx=names=>names.map(n=>cols.indexOf(n.toLowerCase().replace(/[\\s_\\-]/g,''))).find(x=>x>=0)??-1;
const pick=(r,names)=>{let i=idx(names);return i<0?'':String(r[i]??'')};
const n=v=>Number(String(v??'').replace(/[฿,\\s]/g,''))||0;
const shopee=idx(['หมายเลขคำสั่งซื้อ'])>=0;
let parsed=a.filter(r=>r.some(v=>String(v).trim())).map(r=>({
 id:pick(r,['หมายเลขคำสั่งซื้อ','orderid','เลขออเดอร์','reference']),
 company:pick(r,['company','บริษัท'])||'MERITLINKS',
 total:n(pick(r,['จำนวนเงินทั้งหมด','total','grandtotal','ยอดสุทธิ'])),
 shipping:n(pick(r,['ค่าจัดส่งที่ชำระโดยผู้ซื้อ','shipping','ค่าขนส่ง'])),
 productPaid:n(pick(r,['ราคาสินค้าที่ชำระโดยผู้ซื้อ (THB)','productpaid','ราคาสินค้าที่ชำระโดยผู้ซื้อ'])),
 sellerVoucher:n(pick(r,['โค้ดส่วนลดชำระโดยผู้ขาย','sellervoucher'])),
 doc:/tax|กำกับ/i.test(pick(r,['documenttype','ประเภทเอกสาร']))?'tax':'cash',
 taxId:pick(r,['taxid','เลขผู้เสียภาษี']),
 address:pick(r,['address','ที่อยู่','ที่อยู่ในการจัดส่ง']),
 statusText:pick(r,['สถานะการสั่งซื้อ','status']),
 sku:pick(r,['เลขอ้างอิง SKU (SKU Reference No.)','sku']),
 itemCount:1
}));
if(parsed.every(r=>!r.id))throw Error('ไม่พบคอลัมน์หมายเลขคำสั่งซื้อ / Order ID');
if(shopee){
 const group=new Map();
 for(const r of parsed){const key=r.company+'|'+r.id;const existing=group.get(key);if(!existing){group.set(key,r);continue}
 existing.itemCount++;
 // Shopee order totals and buyer shipping repeat on every SKU line; do not add those fields.
 // Product-paid values often repeat as order-level totals too; preserve one and flag differences.
 if(Math.abs(existing.total-r.total)>0.01)existing.importWarning='ยอดรวมในแต่ละแถวไม่ตรงกัน';
 if(Math.abs(existing.shipping-r.shipping)>0.01)existing.importWarning='ค่าขนส่งในแต่ละแถวไม่ตรงกัน';
 }
 parsed=[...group.values()];
}
rows=parsed;cursor=0;currentStep=0;activeBill=null;inspect();
for(const r of rows){if(r.importWarning){r.issue=(r.issue?r.issue+'; ':'')+r.importWarning;r.status='รอตรวจ'}}
persist();log('นำเข้า '+a.length+' แถว รวมเป็น '+rows.length+' ออเดอร์'+(shopee?' (Shopee ไทย)':''));tab('orders')
}
async function loadXlsx(){if(window.XLSX)return;await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';el.onload=resolve;el.onerror=()=>reject(Error('โหลดตัวอ่าน Excel ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต'));document.head.appendChild(el)})}
async function importFile(file){if(!file)throw Error('กรุณาเลือกไฟล์');if(file.size>15e6)throw Error('ไฟล์ใหญ่เกิน 15 MB');if(/\\.(xlsx|xls)$/i.test(file.name)){await loadXlsx();const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});const sheet=workbook.Sheets[workbook.SheetNames[0]];if(!sheet)throw Error('ไม่พบชีตใน Excel');importRows(XLSX.utils.sheet_to_csv(sheet,{blankrows:false}));}else if(/\\.csv$/i.test(file.name)){importRows(await file.text())}else throw Error('รองรับ .csv .xlsx และ .xls เท่านั้น')}
function downloadCsv(){const cols=['Order ID','Company','Total','Shipping','Document Type','Status','Issue'];const safe=v=>{let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s.trim()))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const lines=[cols,...rows.map(r=>[r.id,r.company,r.total,r.shipping,r.doc,r.status,r.issue])];const blob=new Blob(['\uFEFF'+lines.map(x=>x.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='cashbill-review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function start(){if(!rows.length)return alert('กรุณานำเข้า CSV ก่อน');if(timer)return;paused=false;if(cursor>=rows.length)cursor=0;timer=setInterval(()=>{if(paused)return;let r=rows[cursor];if(!r){stop();log('ตรวจครบแล้ว');render();return}activeBill=r;const labels=['รายการสินค้า','ยอดสินค้า','ค่าขนส่ง','ส่วนลดผู้ขาย','VAT','ยอดสุทธิ'];log(r.id+': '+labels[currentStep]);currentStep++;if(currentStep>=6){currentStep=0;cursor++;log(r.id+': '+(r.issue||'ผ่านตรวจเบื้องต้น'))}render();if(cursor>=rows.length){stop();log('ตรวจครบ '+rows.length+' รายการ');render()}},600);render()}
function stop(){clearInterval(timer);timer=null;paused=false}
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>tab(x.dataset.page));document.querySelectorAll('[data-rule]').forEach(x=>x.onchange=()=>{rules[Number(x.dataset.rule)].enabled=x.checked;inspect();render()});if($('import'))$('import').onclick=async()=>{try{let file=$('file').files[0];if(!file)throw Error('กรุณาเลือกไฟล์');if(file.size>10e6)throw Error('ไฟล์ใหญ่เกิน 10MB');await importFile(file)}catch(e){alert(e.message)}};if($('sample'))$('sample').onclick=()=>importRows('Order ID,Company,Total,Shipping,Document Type,Tax ID,Address\nSP-0001,MERITLINKS,379,55,cash,,\nSP-0002,MERITLINKS,599,0,tax,,\nSP-0001,MERITLINKS,379,55,cash,,\nTT-0003,BD,250,20,cash,,');if($('export'))$('export').onclick=downloadCsv;if($('clear'))$('clear').onclick=()=>{if(confirm('ล้างข้อมูลทดลองในอุปกรณ์นี้?')){rows=[];cursor=0;events=[];persist();render()}};if($('addRule'))$('addRule').onclick=()=>{let n=$('ruleName').value.trim();if(n){rules.push({name:n,enabled:false});persist();render()}};if($('runCommand'))$('runCommand').onclick=()=>{let s=$('command').value;const a=/ซ้ำ|duplicate/i.test(s)?'ตรวจออเดอร์ซ้ำ':/ภาษี|vat|กำกับ/i.test(s)?'ตรวจข้อมูลใบกำกับภาษี':/เงินสด|cash/i.test(s)?'เตรียมตรวจบิลเงินสด':'ตรวจยอดและตรวจข้อมูล';$('answer').textContent='แผนที่แนะนำ: '+a+' → ไปหน้าอัปโหลดไฟล์ → ตรวจผลในรายการบิล → ส่งออก CSV (ไม่มีการสร้างเอกสารจริง)';log('รับคำสั่ง: '+s.slice(0,80))};if($('start'))$('start').onclick=start;if($('pause'))$('pause').onclick=()=>{paused=!paused;log(paused?'พักงาน':'ทำงานต่อ');render()};if($('stop'))$('stop').onclick=()=>{stop();log('หยุดงาน');render()}}
nav();inspect();render();
</script></body></html>
