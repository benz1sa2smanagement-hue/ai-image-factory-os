name: CI

# GitHub CI Verification (layer B) — runs on GitHub runners, not owner PC.
# This is NOT production runtime. Deploy stays separate / manual until secrets exist.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      # Optional SQL lifecycle check (node:sqlite, no Cloudflare account required)
      - name: D1 SQL integration sim
        run: node scripts/d1-integration-sim.mjs
        continue-on-error: true
