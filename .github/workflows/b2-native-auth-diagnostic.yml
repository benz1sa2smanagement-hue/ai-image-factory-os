name: B2 Native Auth Diagnostic

# Temporary diagnostic only — validates that Repository Secrets
# B2_KEY_ID + B2_APPLICATION_KEY are accepted by B2 Native API.
# Does NOT test S3, SigV4, or storage adapter.
# Manual only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-auth:
    name: B2 Native Authorize Account
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require B2 secrets present
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "Missing required GitHub Secrets: B2_KEY_ID and/or B2_APPLICATION_KEY"
            exit 1
          fi
          echo "Secrets present (values not printed)"

      - name: Call b2_authorize_account
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          set -e

          # Use curl with Basic auth via -u so the header is never echoed.
          # Write body to a temp file; never cat the full body.
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -u "${B2_KEY_ID}:${B2_APPLICATION_KEY}" \
            -X POST \
            "https://api.backblazeb2.com/b2api/v4/b2_authorize_account")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "AUTHENTICATION: PASS"
            rm -f "$BODY_FILE"
            exit 0
          fi

          # Failure path: extract only Code and Message if present (JSON).
          # Never print the raw body.
          CODE=""
          MSG=""
          if command -v python3 >/dev/null 2>&1; then
            CODE=$(python3 -c "
import json,sys
try:
  d=json.load(open(sys.argv[1]))
  print(d.get('code') or d.get('Code') or '')
except Exception:
  pass
" "$BODY_FILE" 2>/dev/null || true)
            MSG=$(python3 -c "
import json,sys
try:
  d=json.load(open(sys.argv[1]))
  print(d.get('message') or d.get('Message') or '')
except Exception:
  pass
" "$BODY_FILE" 2>/dev/null || true)
          fi

          rm -f "$BODY_FILE"

          echo "AUTHENTICATION: FAIL"
          if [ -n "$CODE" ]; then
            echo "B2 Code: $CODE"
          fi
          if [ -n "$MSG" ]; then
            # Message may contain a key id placeholder; print as-is from API
            # but we never print our own secrets.
            echo "B2 Message: $MSG"
          fi
          exit 1
