name: B2 Native Auth Diagnostic

# Temporary diagnostic — validates Repository Secrets against B2 Native API only.
# Does NOT test S3 / SigV4 / storage adapter.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-auth:
    name: B2 Native Authorize Account
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require B2 secrets present
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "Missing required GitHub Secrets: B2_KEY_ID and/or B2_APPLICATION_KEY"
            exit 1
          fi
          echo "Secrets present (values not printed)"

      - name: Call b2_authorize_account
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          set -e
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -u "${B2_KEY_ID}:${B2_APPLICATION_KEY}" \
            -X POST \
            "https://api.backblazeb2.com/b2api/v4/b2_authorize_account")
          echo "HTTP status: ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "AUTHENTICATION: PASS"
            rm -f "$BODY_FILE"
            exit 0
          fi
          CODE=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('code') or d.get('Code') or '')" "$BODY_FILE" 2>/dev/null || true)
          MSG=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('message') or d.get('Message') or '')" "$BODY_FILE" 2>/dev/null || true)
          rm -f "$BODY_FILE"
          echo "AUTHENTICATION: FAIL"
          if [ -n "$CODE" ]; then
            echo "B2 Code: $CODE"
          fi
          if [ -n "$MSG" ]; then
            echo "B2 Message: $MSG"
          fi
          exit 1
