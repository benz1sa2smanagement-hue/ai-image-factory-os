name: B2 Secret Forensics

# Temporary diagnostic — inspects GitHub Secret representation ONLY.
# Never prints secret values, substrings, Authorization, or signatures.
# Never contacts Backblaze / B2.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-forensics:
    name: Inspect B2 Secret Representation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require secrets present
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          if [ -z "$B2_KEY_ID" ]; then
            echo "B2_KEY_ID: MISSING"
            exit 1
          fi
          if [ -z "$B2_APPLICATION_KEY" ]; then
            echo "B2_APPLICATION_KEY: MISSING"
            exit 1
          fi
          echo "B2_KEY_ID: PRESENT"
          echo "B2_APPLICATION_KEY: PRESENT"

      - name: Character representation forensics
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          python3 << 'PY'
          import hashlib
          import os

          def char_class(ch: str) -> str:
              if not ch:
                  return "EMPTY"
              o = ord(ch)
              if ch == " ":
                  return "SPACE"
              if ch == "\t":
                  return "TAB"
              if ch == "\r":
                  return "CR"
              if ch == "\n":
                  return "LF"
              if ch.isspace():
                  return "OTHER_WHITESPACE"
              if ("A" <= ch <= "Z") or ("a" <= ch <= "z") or ("0" <= ch <= "9"):
                  return "ASCII_ALPHANUMERIC"
              if o < 128 and not ch.isalnum() and not ch.isspace():
                  return "ASCII_PUNCTUATION"
              if o >= 128:
                  return "NON_ASCII"
              return "OTHER"

          def profile(name: str, value: str) -> None:
              raw = value.encode("utf-8")
              exact_sha = hashlib.sha256(raw).hexdigest()
              trimmed = value.strip()
              trimmed_sha = hashlib.sha256(trimmed.encode("utf-8")).hexdigest()

              letters = digits = punct = ws = non_ascii = controls = 0
              for ch in value:
                  o = ord(ch)
                  if ch.isalpha() and o < 128:
                      letters += 1
                  elif ch.isdigit() and o < 128:
                      digits += 1
                  elif ch.isspace():
                      ws += 1
                  elif o < 32 or o == 127:
                      controls += 1
                  elif o >= 128:
                      non_ascii += 1
                  elif o < 128:
                      punct += 1

              first = value[0] if value else ""
              last = value[-1] if value else ""

              print(f"{name}:")
              print(f"  bytes: {len(raw)}")
              print(f"  characters: {len(value)}")
              print(f"  first_class: {char_class(first)}")
              print(f"  last_class: {char_class(last)}")
              print(f"  leading_space: {str(value.startswith(' ')).lower()}")
              print(f"  trailing_space: {str(value.endswith(' ')).lower()}")
              print(f"  leading_tab: {str(value.startswith(chr(9))).lower()}")
              print(f"  trailing_tab: {str(value.endswith(chr(9))).lower()}")
              print(f"  contains_cr: {str(chr(13) in value).lower()}")
              print(f"  contains_lf: {str(chr(10) in value).lower()}")
              print(f"  contains_unicode_whitespace: {str(any(ch.isspace() and ch not in (' ', chr(9), chr(10), chr(13)) for ch in value)).lower()}")
              print(f"  any_whitespace_anywhere: {str(any(ch.isspace() for ch in value)).lower()}")
              print(f"  control_chars: {str(any((ord(ch) < 32 or ord(ch) == 127) for ch in value)).lower()}")
              print(f"  ASCII-only: {str(all(ord(ch) < 128 for ch in value)).lower()}")
              print(f"  ASCII letters: {letters}")
              print(f"  ASCII digits: {digits}")
              print(f"  ASCII punctuation: {punct}")
              print(f"  ASCII whitespace: {ws}")
              print(f"  non-ASCII: {non_ascii}")
              print(f"  control characters: {controls}")
              print(f"  SHA256: {exact_sha}")
              print(f"  TRIMMED_SHA256: {trimmed_sha}")
              print(f"  TRIM_CHANGES_VALUE: {str(exact_sha != trimmed_sha).lower()}")
              print(f"  TRAILING_NEWLINE: {str(value.endswith(chr(10)) or value.endswith(chr(13))).lower()}")
              print(f"  TRAILING_WHITESPACE: {str(len(value) > 0 and value[-1].isspace()).lower()}")
              print()

          key_id = os.environ.get("B2_KEY_ID", "")
          app_key = os.environ.get("B2_APPLICATION_KEY", "")
          profile("B2_KEY_ID", key_id)
          profile("B2_APPLICATION_KEY", app_key)
          print("Environment integrity:")
          print("  source: secrets.B2_KEY_ID / secrets.B2_APPLICATION_KEY via env")
          print("  matrix_override: false")
          print("  environment_override: false")
          print("  alternate_credential_source: false")
          print("  shell_transform: false")
          print("  base64_encode_decode: false")
          print("  concatenation: false")
          PY
