name: B2 Standard S3 Diagnostic

# Temporary diagnostic — AWS CLI S3 client against B2 S3-compatible API.
# Does NOT use B2HttpTransport / custom SigV4.
# Never prints credentials, Authorization, or signatures.
# Never enables --debug.

on:
  workflow_dispatch: {}
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  standard-s3:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/run-b2-diagnostic' && github.event.comment.user.login == github.repository_owner) }}
    name: Standard AWS CLI S3 vs B2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require B2 secrets present
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "Missing required GitHub Secrets: B2_KEY_ID and/or B2_APPLICATION_KEY"
            exit 1
          fi
          echo "Secrets present (values not printed)"

      - name: Install AWS CLI if needed
        run: |
          set +x
          if command -v aws >/dev/null 2>&1; then
            aws --version
          else
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
            aws --version
          fi

      - name: Fingerprint B2 GitHub secrets safely
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          python3 - <<'PY'
          import hashlib, os, re
          for name in ("B2_KEY_ID", "B2_APPLICATION_KEY"):
              value = os.environ.get(name, "")
              trimmed = value.strip()
              print(f"{name}_LENGTH={len(value)}")
              print(f"{name}_TRIMMED_LENGTH={len(trimmed)}")
              print(f"{name}_HAS_LEADING_OR_TRAILING_WHITESPACE={'YES' if value != trimmed else 'NO'}")
              print(f"{name}_HAS_NEWLINE={'YES' if any(c in value for c in chr(10)+chr(13)) else 'NO'}")
              print(f"{name}_SHA256_PREFIX={hashlib.sha256(value.encode()).hexdigest()[:16]}")
              print(f"{name}_TRIMMED_SHA256_PREFIX={hashlib.sha256(trimmed.encode()).hexdigest()[:16]}")
          kid = os.environ.get("B2_KEY_ID","")
          key = os.environ.get("B2_APPLICATION_KEY","")
          print("B2_PAIR_DISTINCT_VALUES=" + ("YES" if kid and key and kid != key else "NO"))
          print("B2_KEY_ID_FORMAT=" + ("PLAUSIBLE" if re.fullmatch(r"[A-Za-z0-9_-]{6,200}", kid) else "UNUSUAL"))
          print("B2_APPLICATION_KEY_FORMAT=" + ("PLAUSIBLE" if re.fullmatch(r"[A-Za-z0-9_-]{6,300}", key) else "UNUSUAL"))
          PY

      - name: Diagnose B2 Native API authentication
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set +x
          set -e
          OUT=$(mktemp)
          HTTP=$(curl -sS -o "$OUT" -w "%{http_code}" --user "$B2_KEY_ID:$B2_APPLICATION_KEY" --max-time 20 "https://api.backblazeb2.com/b2api/v4/b2_authorize_account")
          echo "B2_NATIVE_AUTH_HTTP: $HTTP"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("B2_NATIVE_AUTH_STATUS:", "PASS" if d.get("authorizationToken") and d.get("apiUrl") else "FAIL"); print("B2_NATIVE_API_URL:", d.get("apiUrl","unknown")); print("B2_NATIVE_ALLOWED_BUCKET:", (d.get("allowed",{}) or {}).get("bucketName","all")); print("B2_NATIVE_ERROR_CODE:", d.get("code","unknown")); print("B2_NATIVE_ERROR_MESSAGE:", d.get("message","unknown"))' "$OUT" || true
          rm -f "$OUT"

      - name: Publish safe diagnostic summary
        if: ${{ always() && github.event_name == 'issue_comment' }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +x
          OUT=$(mktemp)
          AUTH_OUT=$(mktemp)
          HTTP=$(curl -sS -o "$AUTH_OUT" -w "%{http_code}" --user "$B2_KEY_ID:$B2_APPLICATION_KEY" --max-time 20 "https://api.backblazeb2.com/b2api/v4/b2_authorize_account" || true)
          python3 - "$AUTH_OUT" "$OUT" "$HTTP" <<'PY'
          import hashlib, json, os, re, sys
          auth_path, out_path, http = sys.argv[1:]
          kid=os.environ.get("B2_KEY_ID",""); key=os.environ.get("B2_APPLICATION_KEY","")
          lines=[
            "## B2 safe diagnostic",
            f"- Run: {os.environ.get('GITHUB_RUN_ID','unknown')}",
            f"- B2_KEY_ID length: {len(kid)}; trimmed length: {len(kid.strip())}",
            f"- B2_KEY_ID leading/trailing whitespace: {kid != kid.strip()}",
            f"- B2_KEY_ID newline: {any(c in kid for c in chr(10)+chr(13))}",
            f"- B2_KEY_ID SHA-256 prefix: {hashlib.sha256(kid.encode()).hexdigest()[:16]}",
            f"- B2_APPLICATION_KEY length: {len(key)}; trimmed length: {len(key.strip())}",
            f"- B2_APPLICATION_KEY leading/trailing whitespace: {key != key.strip()}",
            f"- B2_APPLICATION_KEY newline: {any(c in key for c in chr(10)+chr(13))}",
            f"- B2_APPLICATION_KEY SHA-256 prefix: {hashlib.sha256(key.encode()).hexdigest()[:16]}",
            f"- Pair distinct: {bool(kid and key and kid != key)}",
            f"- Key ID format: {'PLAUSIBLE' if re.fullmatch(r'[A-Za-z0-9_-]{6,200}', kid) else 'UNUSUAL'}",
            f"- Application key format: {'PLAUSIBLE' if re.fullmatch(r'[A-Za-z0-9_-]{6,300}', key) else 'UNUSUAL'}",
            f"- Native authorize HTTP: {http}",
          ]
          try:
              d=json.load(open(auth_path))
              lines += [f"- Native authorize code: {d.get('code','unknown')}", f"- Native authorize status: {'PASS' if d.get('authorizationToken') and d.get('apiUrl') else 'FAIL'}"]
          except Exception:
              lines += ["- Native authorize response: non-JSON/empty"]
          open(out_path,"w").write("\n".join(lines)+"\n")
          PY
          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$(cat "$OUT")"
          rm -f "$OUT" "$AUTH_OUT"
      - name: Diagnose B2 endpoint transport
        run: |
          set -e
          ENDPOINT="https://s3.us-west-004.backblazeb2.com"
          echo "DNS:"
          getent ahosts s3.us-west-004.backblazeb2.com | head -n 10 || true
          echo "HTTPS headers (IPv4):"
          curl -4 -sS -I --http1.1 --max-time 15 "$ENDPOINT" | head -n 20 || true
          echo "HTTPS headers (default address family):"
          curl -sS -I --http1.1 --max-time 15 "$ENDPOINT" | head -n 20 || true

      - name: Standard S3 PUT HEAD GET DELETE
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: us-west-004
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set +x
          set +e
          ENDPOINT="https://s3.us-west-004.backblazeb2.com"
          BUCKET="aif-os-e2e-test"
          KEY="task12x/${{ github.run_id }}/test.bin"
          BODY_FILE=$(mktemp)
          printf 'task12x-standard-s3-diagnostic' > "$BODY_FILE"
          ERR_FILE=$(mktemp)

          echo "Endpoint: $ENDPOINT"
          echo "Bucket: $BUCKET"
          echo "Key: task12x/<run_id>/test.bin"
          echo "Region: us-west-004"
          echo "Client: AWS CLI s3api (standard SigV4)"

          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --body "$BODY_FILE" \
            --endpoint-url "$ENDPOINT" \
            --region us-west-004 \
            --no-cli-pager \
            >/tmp/s3-put-out.txt 2>"$ERR_FILE"
          PUT_RC=$?

          if [ "$PUT_RC" -ne 0 ]; then
            echo "STANDARD_S3_PUT: FAIL"
            python3 -c 'import re,sys; t=open(sys.argv[1],errors="replace").read(); t=re.sub(r"(?i)(Credential|Signature|AccessKeyId|X-Amz-Credential|X-Amz-Signature)=[^,\\s]+",r"\\1=***",t); print("RAW_REDACTED_ERROR:",t[:1200].replace(chr(10)," | "))' "$ERR_FILE"
            rm -f "$BODY_FILE" "$ERR_FILE" /tmp/s3-put-out.txt
            exit 1
          fi

          echo "STANDARD_S3_PUT: PASS"

          aws s3api head-object \
            --bucket "$BUCKET" --key "$KEY" \
            --endpoint-url "$ENDPOINT" --region us-west-004 --no-cli-pager \
            >/tmp/s3-head-out.txt 2>"$ERR_FILE"
          if [ $? -eq 0 ]; then echo "STANDARD_S3_HEAD: PASS"; else echo "STANDARD_S3_HEAD: FAIL"; fi

          aws s3api get-object \
            --bucket "$BUCKET" --key "$KEY" \
            --endpoint-url "$ENDPOINT" --region us-west-004 --no-cli-pager \
            /tmp/s3-get-body.bin >/tmp/s3-get-out.txt 2>"$ERR_FILE"
          if [ $? -eq 0 ]; then echo "STANDARD_S3_GET: PASS"; else echo "STANDARD_S3_GET: FAIL"; fi

          aws s3api delete-object \
            --bucket "$BUCKET" --key "$KEY" \
            --endpoint-url "$ENDPOINT" --region us-west-004 --no-cli-pager \
            >/tmp/s3-del-out.txt 2>"$ERR_FILE"
          if [ $? -eq 0 ]; then echo "STANDARD_S3_DELETE: PASS"; else echo "STANDARD_S3_DELETE: FAIL"; fi

          aws s3api head-object \
            --bucket "$BUCKET" --key "$KEY" \
            --endpoint-url "$ENDPOINT" --region us-west-004 --no-cli-pager \
            >/tmp/s3-head2-out.txt 2>"$ERR_FILE"
          if [ $? -ne 0 ]; then
            echo "STANDARD_S3_HEAD_AFTER_DELETE: NOT_FOUND (expected)"
          else
            echo "STANDARD_S3_HEAD_AFTER_DELETE: STILL_EXISTS"
            aws s3api delete-object \
              --bucket "$BUCKET" --key "$KEY" \
              --endpoint-url "$ENDPOINT" --region us-west-004 --no-cli-pager \
              >/dev/null 2>&1 || true
          fi

          rm -f "$BODY_FILE" "$ERR_FILE" /tmp/s3-*.txt /tmp/s3-get-body.bin
          echo "Cleanup complete"
          exit 0
