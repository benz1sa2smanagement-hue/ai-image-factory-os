name = "aif-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ---------------------------------------------------------------------------
# Production runs on Cloudflare — mobile/dashboard will call this Worker.
# Owner PC is NOT required at runtime. Bindings commented until one-time setup.
# ---------------------------------------------------------------------------
#
# [[d1_databases]]
# binding = "DB"
# database_name = "aif-os"
# database_id = "<YOUR_D1_ID>"
# migrations_dir = "../../migrations"
#
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "aif-assets"
#
# [[queues.producers]]
# binding = "FACTORY_QUEUE"
# queue = "aif-factory"
#
# [ai]
# binding = "AI"

[vars]
MOCK_MODE = "true"
FACTORY_DEFAULT_STATUS = "STOPPED"
