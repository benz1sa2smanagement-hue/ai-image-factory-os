name = "aif-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Production runs on Cloudflare. No persistent image storage binding is required.
[[d1_databases]]
binding = "DB"
database_name = "aif-os"
migrations_dir = "../../migrations"

# Queue producer (aif-api → aif-factory)
# Create once: npx wrangler queues create aif-factory
# [[queues.producers]]
# binding = "FACTORY_QUEUE"
# queue = "aif-factory"

[ai]
binding = "AI"

[vars]
# Generated image bytes are transient only; no R2/Drive/B2 binding.
MOCK_MODE = "true"
FACTORY_DEFAULT_STATUS = "STOPPED"