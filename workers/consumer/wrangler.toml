name = "aif-consumer"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ---------------------------------------------------------------------------
# Production runs on Cloudflare — owner PC is NOT required at runtime.
# Bindings below are intentionally commented until one-time resource setup.
# Do NOT commit real secrets. Use Cloudflare dashboard / wrangler secret.
# ---------------------------------------------------------------------------
#
# After creating D1/R2/Queue in Cloudflare (one-time):
#
# [[d1_databases]]
# binding = "DB"
# database_name = "aif-os"
# database_id = "<YOUR_D1_ID>"
# migrations_dir = "../../migrations"
#
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "aif-assets"
#
# Queue CONSUMER (aif-consumer ← aif-factory)
# Supported job types (message.body.type):
#   IMAGE_GENERATION | QC | DUPLICATE_CHECK | METADATA | CLEANUP | WATCHDOG
# Native Cloudflare retry: max_retries = 3 (after that message discarded by CF;
#   application DLQ is D1 dead_letter_jobs — do NOT create a second Queue)
# Create queue once:  npx wrangler queues create aif-factory
# Then uncomment:
# [[queues.consumers]]
# queue = "aif-factory"
# max_batch_size = 5
# max_retries = 3
#
# [ai]
# binding = "AI"
#
# Cron (watchdog / cleanup) — enable when ready:
# [triggers]
# crons = ["*/15 * * * *"]

[vars]
MOCK_MODE = "true"
