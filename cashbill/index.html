g:22px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8995a7;background:#fafbfd;font-weight:700}th,td{padding:16px 20px;border-bottom:1px solid #f0f2f6}tr:last-child td{border-bottom:0}.pill{font-size:10px;font-weight:700;border-radius:99px;padding:6px 9px;display:inline-block;background:#edf2ff;color:#4662cd}.pill.warn{background:#fff5e6;color:#a67024}.pill.bad{background:#ffeded;color:#c44f57}.pill.ok{background:#e9f8f0;color:#21825c}.channels{display:grid;gap:15px}.chrow{display:flex;align-items:center;justify-content:space-between;font-size:12px}.track{height:7px;background:#eef1f7;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;border-radius:10px;background:#506df3}.stack{display:grid;gap:16px}.detailbox{background:#f8faff;padding:17px;border:1px solid #edf1fa;border-radius:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:13px 15px;border:1px solid #f2dba9;background:#fffbf0;border-radius:12px;font-size:12px;color:#8c651f;line-height:1.8}.toast{position:fixed;bottom:22px;right:22px;padding:13px 18px;border-radius:11px;background:#15253e;color:white;font-size:12px;box-shadow:0 8px 24px #1c2f5150;display:none;max-width:340px;z-index:9}.layout2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.fieldlabel{font-size:12px;font-weight:700;margin:0 0 9px}.field{display:grid;gap:7px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:11px;color:#6b7688}.tabs button.on{background:#edf2ff;color:#2f51dc;border-color:#dce4ff}.lineitem{padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.lineitem:last-child{border:0}.ring{display:grid;place-items:center;border-radius:50%;width:100px;height:100px;background:conic-gradient(#4768f4 0 68%,#ebeff8 68% 100%);margin:auto}.ring span{display:grid;place-items:center;width:77px;height:77px;border-radius:50%;background:#fff;font-size:21px;font-weight:800}.mobilebar{display:none}.dot{display:inline-block;width:7px;height:7px;background:#25b477;border-radius:50%;margin-right:7px}.empty{padding:26px;color:#7b8798;font-size:13px;text-align:center}.mono{font-variant-numeric:tabular-nums}#fileinput{max-width:100%;font-size:12px}@media(max-width:1050px){.sidebar{width:205px}.content{padding:28px 22px}.top{padding:0 22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.layout2{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{display:none}.top{height:64px;padding:0 17px}.content{padding:25px 15px 96px}.heading h1{font-size:24px}.heading{flex-direction:column}.cards{gap:9px}.card{padding:15px}.metric{font-size:25px}.metricicon{width:30px;height:30px;font-size:15px}.panelhead{padding:16px}.panelbody{padding:15px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:10px 2px env(safe-area-inset-bottom)}.mobilebar button{background:transparent;border:0;color:#8190a3;font-size:10px;display:grid;gap:5px;justify-items:center}.mobilebar button.active{color:#355cf5;font-weight:700}.mobilebar button span{font-size:20px}.topright .tiny{display:none}.top .crumb{font-size:12px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">✦</div><div>Cashbill AI<small>FINANCE WORKSPACE</small></div></div><div class="navhead">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="sidefoot"><strong>● DEMO MODE</strong><br>ยังไม่เชื่อม FlowAccount<br>ไม่มีการสร้าง แก้ไข หรือลบบิลจริง</div></aside><main class="main"><header class="top"><div class="crumb">Workspace / <strong id="crumb">Overview</strong></div><div class="topright"><span class="tiny"><span class="dot"></span>Preview environment</span><select class="select" id="company" onchange="setCompany(this.value)"><option value="all">ทุกบริษัท</option><option value="MERITLINKS">Meritlinks</option><option value="BD">B&D Trade</option></select><div class="avatar">N</div></div></header><div class="content" id="content"></div></main></div><nav class="mobilebar" id="mobile"></nav><div id="toast" class="toast"></div><script>
const menu=[['overview','▦','ภาพรวม'],['orders','▤','รายการออเดอร์'],['assistant','✦','AI Prompt Studio'],['exceptions','⚑','ตรวจผิดปกติ'],['automation','◷','Automation'],['memory','◇','AI Memory']];
let page='overview',company='all',filter='all',current='',runCount=0;let items=[{id:'SP-26090101',company:'MERITLINKS',channel:'Shopee',total:314,status:'duplicate',issue:'มีทั้งบิลเงินสดและใบกำกับภาษี',discount:20},{id:'TT-26090102',company:'BD',channel:'TikTok',total:759,status:'new',issue:'ยังไม่มีเอกสาร',discount:0},{id:'LZ-26090103',company:'MERITLINKS',channel:'Lazada',total:534,status:'mismatch',issue:'ค่าขนส่งต่าง 35 บาท',discount:0},{id:'SP-26090104',company:'BD',channel:'Shopee',total:899,status:'tax',issue:'มีคำขอใบกำกับภาษีเต็มรูป',discount:0},{id:'SP-26090105',company:'MERITLINKS',channel:'Shopee',total:309,status:'exception',issue:'ส่วนลดท้ายบิลไม่ตรง',discount:25},{id:'TT-26090106',company:'MERITLINKS',channel:'TikTok',total:488,status:'ready',issue:'ตรวจผ่าน',discount:0}];const stateText={duplicate:'บิลซ้ำ',new:'รอเปิดบิล',mismatch:'ยอดไม่ตรง',tax:'คำขอใบกำกับ',exception:'ต้องตรวจสอบ',ready:'ตรวจผ่าน'};const pill={duplicate:'bad',new:'',mismatch:'warn',tax:'warn',exception:'bad',ready:'ok'};let rules=JSON.parse(localStorage.getItem('cashbill_rules_demo')||'[]');const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

ick="go(\'assistant\')">✦ สั่งงานด้วย AI</button>')+'<div class="cards">'+stat('ออเดอร์ตัวอย่าง',data().length,'▤','ข้อมูลจำลอง')+stat('รอเปิดบิล',data().filter(x=>x.status==='new').length,'＋','รอตรวจและอนุมัติ')+stat('บิลผิดปกติ',data().filter(x=>['exception','mismatch','duplicate'].includes(x.status)).length,'⚑','ต้องตรวจสอบ','amber')+stat('กฎที่จดจำ',rules.length,'✦','บันทึกบนเบราว์เซอร์','green')+'</div><div class="grid"><div class="panel"><div class="panelhead"><strong>รายการที่ต้องดำเนินการ</strong><button class="btn" onclick="go(\'orders\')">ดูทั้งหมด →</button></div>'+table(data().slice(0,5))+'</div><div class="stack"><div class="panel"><div class="panelhead"><strong>ช่องทางการขาย</strong><span class="tiny">ตัวอย่าง</span></div><div class="panelbody channels">'+['Shopee','TikTok','Lazada'].map((c,j)=>'<div><div class="chrow"><strong>'+c+'</strong><span>'+data().filter(i=>i.channel===c).length+' ออเดอร์</span></div><div class="track"><div class="fill" style="width:'+([68,43,25][j])+'%"></div></div></div>').join('')+'</div></div><div class="panel"><div class="panelhead"><strong>AI Smart Memory</strong></div><div class="panelbody"><div class="sub">ระบบจดจำกฎที่ผ่านการอนุมัติแล้ว เพื่อใช้แนะนำการแก้ไขครั้งต่อไป</div><br><button class="btn secondary" onclick="go(\'memory\')">ดูคลังกฎ →</button></div></div></div></div>'}
if(page==='orders'){el.innerHTML=header('รายการออเดอร์','ค้นหาและตรวจสอบเลขออเดอร์ก่อนสร้างหรือแก้ไขบิล','<button class="btn primary" onclick="go(\'assistant\')">＋ สร้างคำสั่งใหม่</button>')+'<div class="panel"><div class="panelhead"><strong>รายการล่าสุด</strong><div class="tabs">'+[['all','ทั้งหมด'],['new','รอเปิด'],['duplicate','บิลซ้ำ'],['exception','ผิดปกติ']].map(a=>'<button class="'+(filter===a[0]?'on':'')+'" onclick="filter=\''+a[0]+'\';render()">'+a[1]+'</button>').join('')+'</div></div>'+table(data())+'</div>'}
if(page==='assistant'){el.innerHTML=header('AI Prompt Studio','อัปโหลด Excel/CSV แล้วเตรียมคำสั่งตรวจสอบหรือแก้ไขบิลตาม Order ID')+'<div class="layout2"><div class="panel"><div class="panelhead"><strong>✦ สั่งงานด้วยภาษาธรรมดา</strong><span class="pill">PREVIEW</span></div><div class="panelbody"><div class="field"><div class="fieldlabel">ไฟล์ต้นทาง</div><input id="fileinput" type="file" accept=".csv,.xlsx,.xls"><div class="tiny" id="filelabel">ไฟล์จะยังไม่ถูกส่งไปยัง FlowAccount</div></div><div class="field"><div class="fieldlabel">คำสั่งให้ AI วิเคราะห์</div><textarea id="prompt" placeholder="เช่น แก้ส่วนลดท้ายบิลตาม Seller Voucher จับคู่จากเลข Order ID...">จับคู่เลขออเดอร์จากไฟล์กับ Reference ในบิลเงินสด ตรวจสอบ Seller Voucher และเสนอแก้ไขส่วนลดท้ายบิล ห้ามนำส่วนลดแพลตฟอร์มมาหักซ้ำ ตรวจ VAT และแจ้งบิลที่แก้ไขไม่ได้</textarea></div><div class="actions"><button class="btn primary" onclick="plan()">วิเคราะห์และเตรียมแผน →</button><button class="btn secondary" onclick="reuse()">↻ ใช้กฎครั้งก่อน</button></div><div class="notice" style="margin-top:16px">โหมดทดสอบ: แสดงตัวอย่างแผนเท่านั้น ยังไม่อ่านไฟล์จริงเพื่อแก้บิลและไม่ส่งคำสั่งไป FlowAccount</div></div></div><div class="panel"><div class="panelhead"><strong>แผนงานที่ AI เสนอ</strong></div><div class="panelbody" id="plan"><div class="empty">พิมพ์คำสั่งแล้วกดวิเคราะห์ เพื่อดูขั้นตอนและรายการที่ต้องอนุมัติ</div></div></div></div>'}
if(page==='exceptions'){el.innerHTML=header('Exception Center','บิลที่มีความเสี่ยงจะถูกพักไว้จนกว่าผู้ดูแลจะยืนยันวิธีแก้')+'<div class="layout2"><div class="panel"><div class="panelhead"><strong>รายการผิดปกติ</strong><span class="pill bad">Action required</span></div>'+data().filter(x=>['exception','duplicate','mismatch','tax'].includes(x.status)).map(i=>'<div class="lineitem" style="padding:18px 22px"><div class="row"><div><strong>'+i.id+'</strong><div class="sub">'+i.issue+'</div></div><button class="btn" onclick="exception(\''+i.id+'\')">ตรวจสอบ →</button></div></div>').join('')+'</div><div class="panel"><div class="panelhead"><strong>รายละเอียด / สอนระบบ</strong></div><div class="panelbody" id="exceptionDetail"><div class="empty">เลือกบิลด้านซ้ายเพื่อตรวจปัญหาและอนุมัติกฎ</div></div></div></div>'}
if(page==='automation'){el.innerHTML=header('Automation Monitor','ติดตามการทำงานในแต่ละขั้นตอน พร้อมบันทึกสถานะและผลลัพธ์')+'<div class="grid"><div class="panel"><div class="panelhead"><strong>สถานะงานล่าสุด</strong><span class="pill">SIMULATION</span></div><div class="panelbody stack"><div class="row"><div><div class="sub">ตรวจรายการในคิว</div><div class="metric">'+runCount+' / 6</div></div><div class="ring"><span>'+Math.round(runCount/6*100)+'%</span></div></div><div class="track"><div class="fill" style="width:'+runCount/6*100+'%"></div></div><div class="actions"><button class="btn primary" onclick="runCount=Math.min(6,runCount+1);render()">▶ จำลองขั้นตอนถัดไป</button><button class="btn" onclick="runCount=0;render()">↻ เริ่มใหม่</button></div><div class="notice">ยังไม่ได้เชื่อมตัวควบคุมเบราว์เซอร์ FlowAccount สถานะนี้เป็นตัวอย่างเท่านั้น</div></div></div><div class="panel"><div class="panelhead"><strong>ขั้นตอนระบบจริง</strong></div><div class="panelbody">'+['ตรวจเลข Order ID และบิลซ้ำ','ตรวจส่วนลดและยอดรวม VAT','รอผู้มีสิทธิ์ Approve','ลงมือทำผ่านการเชื่อมต่อที่รองรับ','ตรวจความถูกต้องและเก็บ Audit Log'].map((s,i)=>'<div class="lineitem"><span style="color:#4766d8;margin-right:10px">'+('0'+(i+1))+'</span>'+s+'</div>').join('')+'</div></div></div>'}
if(page==='memory'){el.innerHTML=header('AI Memory & Rules','กฎที่ผู้ดูแลอนุมัติจะช่วยลดการอธิบายคำสั่งซ้ำ')+'<div class="panel"><div class="panelhead"><strong>คลังกฎที่อนุมัติแล้ว</strong><span class="pill">'+rules.length+' กฎ</span></div><div class="panelbody">'+(rules.length?rules.map((r,i)=>'<div class="lineitem"><div class="row"><div><strong>'+r.order+'</strong><div class="sub">'+esc(r.rule)+'</div><div class="tiny">'+r.date+'</div></div><button class="btn danger" onclick="drop('+i+')">ลบกฎ</button></div></div>').join(''):'<div class="empty">ยังไม่มีกฎที่บันทึกไว้ ทดลองอนุมัติจาก Exception Center</div>')+'</div></div>'}
}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function detail(id){let i=items.find(x=>x.id===id);toast('บิล '+id+' • '+i.issue+' (ข้อมูลจำลอง)')}function exception(id){let i=items.find(x=>x.id===id);document.getElementById('exceptionDetail').innerHTML='<div class="detailbox"><div class="row"><strong>'+id+'</strong>'+badge(i.status)+'</div><div class="sub" style="margin-top:10px">'+i.issue+'</div><div style="margin-top:13px;font-size:12px">ยอดออเดอร์: <strong>'+money(i.total)+'</strong></div></div><div class="field"><div class="fieldlabel">วิธีแก้ไขที่ต้องการจดจำ</div><textarea id="solution" placeholder="เช่น ใช้ Seller Voucher เป็นส่วนลดท้ายบิล และห้ามหัก Shopee Voucher ซ้ำ"></textarea></div><div class="field"><label class="sub"><input type="checkbox" id="remember" checked> บันทึกกฎเพื่อใช้แนะนำในครั้งต่อไป</label></div><button class="btn primary" onclick="approve(\''+id+'\')">✓ Approve กฎตัวอย่าง</button><div class="notice" style="margin-top:16px">Approve นี้จำลองและเก็บกฎไว้เฉพาะเบราว์เซอร์ ไม่ได้อนุมัติหรือแก้บิลจริง</div>'};function approve(id){let rule=document.getElementById('solution').value.trim();if(!rule)return toast('กรุณาระบุวิธีแก้ไขก่อนอนุมัติ');if(document.getElementById('remember').checked){rules.unshift({order:id,rule,date:new Date().toLocaleString('th-TH')});localStorage.setItem('cashbill_rules_demo',JSON.stringify(rules))}toast('บันทึกกฎตัวอย่างแล้ว ไม่ได้แก้ไขบิลจริง');render()}function drop(i){rules.splice(i,1);localStorage.setItem('cashbill_rules_demo',JSON.stringify(rules));render()}function reuse(){if(!rules.length)return toast('ยังไม่มีกฎที่เคยอนุมัติ');document.getElementById('prompt').value=rules[0].rule;toast('นำกฎล่าสุดกลับมาใช้แล้ว')}function plan(){let t=document.getElementById('prompt').value.trim();if(!t)return toast('กรุณาพิมพ์คำสั่ง');document.getElementById('plan').innerHTML='<div class="stack"><span class="pill">DRAFT PLAN</span><strong>ข้อเสนอการตรวจสอบ</strong><div class="sub">คำสั่ง: '+esc(t)+'</div>'+['ตรวจไฟล์และหัวคอลัมน์','จับคู่ Order ID กับ Reference','ตรวจบิลซ้ำและประเภทเอกสาร','เทียบส่วนลดท้ายบิลและ VAT','แสดงรายการก่อน/หลัง และรอ Approve'].map((x,i)=>'<div class="lineitem">0'+(i+1)+' · '+x+'</div>').join('')+'<div class="notice">การสร้างและแก้ไขเอกสารจริงยังปิดใช้งาน</div></div>'};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}nav();render();
</script></body></html>
